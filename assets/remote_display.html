<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>译声 · 板端画面</title>
<style>html{background:#eff5f4;color:#23433f;font-family:"Microsoft YaHei",sans-serif}body{margin:0;display:grid;min-height:100vh;place-content:center;gap:12px}canvas{width:min(1024px,calc(100vw - 32px));height:auto;display:block;background:#fff;border:1px solid #ccdcd8;border-radius:12px;box-shadow:0 6px 24px #214b3b12;touch-action:none;cursor:pointer}footer{display:flex;justify-content:space-between;font-size:13px;padding:0 4px}#status{color:#327a6b}#hint{color:#65807b}</style>
<canvas id="screen" width="1024" height="600" aria-label="译声板端实时画面，可点击按钮，拖动历史记录"></canvas><footer><span id="status" role="status">正在连接板子…</span><span id="hint">点击按钮操作 · 拖动或滚轮浏览历史</span></footer>
<footer><label>历史格式 <select id="format"><option value="csv">CSV（Excel）</option><option value="txt">TXT 文本</option><option value="json">JSON 完整数据</option></select></label><button id="export">导出历史 · 另存为…</button><span id="exportStatus" role="status"></span></footer>
<style>footer{align-items:center;gap:14px;flex-wrap:wrap}select,button{font:inherit;border:1px solid #c6d9d4;border-radius:7px;padding:8px 12px;background:#fff;color:#23433f}button{background:#087b72;color:white;cursor:pointer}button:disabled{opacity:.6}#exportStatus{font-size:12px;max-width:480px;overflow-wrap:anywhere}</style>
<script>
const screen=document.getElementById('screen'),ctx=screen.getContext('2d'),status=document.getElementById('status');let frame=0,epoch=0,down=null,busy=false;
document.getElementById('export').addEventListener('click',async function(){
 const note=document.getElementById('exportStatus'),kind=document.getElementById('format').value;this.disabled=true;
 try{
  if(window.showSaveFilePicker){
   let handle;try{handle=await window.showSaveFilePicker({suggestedName:'译声历史_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+kind,types:[{description:kind.toUpperCase()+' 文件',accept:{[kind==='csv'?'text/csv':kind==='txt'?'text/plain':'application/json']:['.'+kind]}}]})}catch(e){if(e.name==='AbortError'){note.textContent='已取消';return}throw e}
   note.textContent='正在读取板上定稿历史…';const r=await fetch('/history?format='+kind);if(!r.ok)throw Error((await r.json()).error);const data=await r.blob(),writer=await handle.createWritable();await writer.write(data);await writer.close();note.textContent='已保存 '+handle.name;
  }else{
   note.textContent='请在“另存为”窗口选择位置…';const r=await fetch('/save-history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format:kind})}),result=await r.json();if(!r.ok)throw Error(result.error);note.textContent=result.cancelled?'已取消':'已保存到 '+result.path;
  }
 }catch(e){note.textContent='导出失败：'+e.message}finally{this.disabled=false}
});
const point=e=>{const r=screen.getBoundingClientRect();return {x:Math.max(0,Math.min(1023,Math.floor((e.clientX-r.left)*1024/r.width))),y:Math.max(0,Math.min(599,Math.floor((e.clientY-r.top)*600/r.height)))}};
async function send(a,b){if(busy)return;busy=true;try{const r=await fetch('/pointer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({press_x:a.x,press_y:a.y,x:b.x,y:b.y,epoch})});const result=await r.json();if(!r.ok)throw Error(result.error);status.textContent=result.accepted?'已同步操作':'此处没有可用操作';}catch(e){status.textContent=e.message}finally{busy=false}}
screen.addEventListener('pointerdown',e=>{down=point(e);screen.setPointerCapture(e.pointerId);e.preventDefault()});screen.addEventListener('pointerup',e=>{if(down)send(down,point(e));down=null});screen.addEventListener('pointercancel',()=>down=null);
screen.addEventListener('wheel',e=>{e.preventDefault();const a=point(e),dy=Math.max(-200,Math.min(200,Math.round(e.deltaY)));send(a,{x:a.x,y:Math.max(0,Math.min(599,a.y-dy))})},{passive:false});
async function update(){try{const s=await (await fetch('/state')).json();if(s.frame && s.frame!==frame){const response=await fetch('/frame.png?frame='+s.frame);if(!response.ok)throw Error('画面接收中');const image=await createImageBitmap(await response.blob());ctx.drawImage(image,0,0);image.close();frame=Number(response.headers.get('X-Frame-ID'));epoch=Number(response.headers.get('X-UI-Epoch'))}if(!busy)status.textContent=s.connected?(s.error||'已连接 · 板端实时画面'):'连接中，请确认网线和板子运行状态';}catch(e){status.textContent='本地连接中断'}setTimeout(update,150)}update();
</script></html>
